# 普通 PyTorch VLA 训练。所有相对路径从仓库根目录解析。
name: openpi
mode: vla
project_name: openpi
exp_name: ee

model:
  type: pi0
  pi05: false
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  is_lora: true            # false：全参微调；true：RLinf PEFT all-linear，基础权重冻结
  lora_rank: 32
  action_dim: 32           # 模型内部 padding，必须 >= data.action_dim
  action_horizon: 50
  max_token_len: 48

data:
  type: franka
  action_space: ee_delta   # joint / ee / ee_delta（数据集均为绝对目标）
  action_dim: 7            # 启动时校验实际动作维度；EE 单臂 6+1=7，双臂 (6+1)*2=14
  motion_dim: null         # 每臂：EE 默认为 6，joint 默认为 7
  gripper_dim: 1           # 每臂夹爪维度；joint 单臂默认总维度 7+1=8
  repo_id: openpi/franka_lerobot_test_100hz
  prompt_from_task: true
  assets:
    assets_dir: null       # 默认 data/assets/openpi/<repo_id>/norm_stats.json
    asset_id: null         # 默认 repo_id

train:
  # 转换后的 RLinf 布局 model.safetensors。目录里没有这份文件时，从 jax_weight_path 转一次。
  pytorch_weight_path: ./data/checkpoints/torch/pi0_base
  # 官方 JAX checkpoint。也可设 OPENPI_JAX_WEIGHT_PATH。pi05: true 时改为 pi05_base。
  jax_weight_path: gs://openpi-assets/checkpoints/pi0_base
  requires_pytorch_weights: true
  pytorch_training_precision: bfloat16
  assets_base_dir: ./data/assets
  checkpoint_base_dir: ./checkpoints  # 保存至 checkpoints/openpi/ee/<step>/
  seed: 42
  batch_size: 5             # 一次优化器更新的全局 batch
  micro_batch_size: 1       # 每张卡一次前向的 batch；累积步数 = batch_size / (micro_batch_size * num_gpus)
  num_gpus: 1               # 启动 DDP；每卡保留完整 VLA，分配不同数据并同步梯度，不切分模型
  num_workers: 2
  num_train_steps: 30000
  log_interval: 100
  save_interval: 1000
  overwrite: false
  resume: false
  wandb_enabled: false

lr_schedule:
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-6
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

policy_metadata:
  action_fps: 30.0        # action_space/dim/horizon 从 data/model 自动派生
