# 普通 PyTorch VLA 训练。所有相对路径从仓库根目录解析。
name: openpi
mode: vla
project_name: openpi
exp_name: joint_7_6_audio_qwen_asr

model:
  type: pi0
  pi05: false
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  is_lora: true            # false：全参微调；true：按 lora_mode 选择训练范围
  lora_mode: lora_only     # lora_only：所有原始权重冻结，只训 LoRA；openpi：Gemma LoRA，视觉/动作/状态/时间投影全参更新
  lora_rank: 48
  action_dim: 32           # 模型内部 padding，必须 >= data.action_dim
  action_horizon: 50
  max_token_len: 48

data:
  type: franka
  action_space: joint      # joint / ee / ee_delta（数据集均为绝对目标）
  action_dim: 8            # 单臂关节动作：7 个关节角 + 1 维夹爪
  motion_dim: null         # 每臂：EE 默认为 6，joint 默认为 7
  gripper_dim: 1           # 每臂夹爪维度；joint 单臂默认总维度 7+1=8
  repo_id: openpi/franka_lerobot_7_6_audio_qwen_asr_v3_mp4
  prompt_from_task: true
  assets:
    assets_dir: null       # 默认 data/assets/openpi/<repo_id>/norm_stats.json
    asset_id: null         # 默认 repo_id

train:
  # 转换后的 RLinf 布局 model.safetensors。目录里没有这份文件时，从 jax_weight_path 转一次。
  pytorch_weight_path: ./data/checkpoints/torch/pi0_base
  # 官方 JAX checkpoint。也可设 OPENPI_JAX_WEIGHT_PATH。pi05: true 时改为 pi05_base。
  jax_weight_path: gs://openpi-assets/checkpoints/pi0_base
  requires_pytorch_weights: true
  pytorch_training_precision: bfloat16
  assets_base_dir: ./data/assets
  checkpoint_base_dir: ./checkpoints  # 保存至 checkpoints/openpi/<exp_name>/<step>/
  seed: 42
  batch_size: 12             # 一次优化器更新的全局 batch
  micro_batch_size: null    # null：每卡一次处理 batch_size / num_gpus，不累积；整数：每卡前向 batch，单/多卡均可累积
  num_gpus: 1               # 启动 DDP；每卡保留完整 VLA，分配不同数据并同步梯度，不切分模型
  num_workers: 2
  num_train_steps: 30000
  log_interval: 100
  save_interval: 5000        # 每 5000 步存一个（30000 步共 6 个）；末步必定保存
  overwrite: false
  resume: false
  tracking_backend: swanlab  # swanlab / wandb / none（关闭追踪）

lr_schedule:
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-6
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

policy_metadata:
  action_fps: 20.0
